---
- name: Ensure Jenkins home directory exists
  file:
    path: "{{ ansible_env.HOME }}/jenkins_home"
    state: directory
    mode: '0755'

- name: Check Jenkins container
  command: docker ps -a --filter "name=jenkins" --format '{{ "{{.Names}}" }}'
  register: jenkins_container
  changed_when: false

- name: Run Jenkins container if missing
  shell: |
    docker run -d \
      --name jenkins \
      -p 8080:8080 -p 50000:50000 \
      -v {{ ansible_env.HOME }}/jenkins_home:/var/jenkins_home \
      -v /var/run/docker.sock:/var/run/docker.sock \
      --restart unless-stopped \
      --user root \
      jenkins/jenkins:lts
  when: jenkins_container.stdout == ""
